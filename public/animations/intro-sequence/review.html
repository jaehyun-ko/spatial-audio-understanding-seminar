<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도입부 2–7 · Manim 미리보기</title><style>
@font-face{font-family:Pretendard;src:url('../../fonts/Pretendard-Regular.woff2');font-weight:400}@font-face{font-family:Pretendard;src:url('../../fonts/Pretendard-Bold.woff2');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;background:#f6f8fa;color:#142233;font-family:Pretendard,sans-serif}body{padding:20px 16px}.holder{margin:auto;position:relative}.deck{position:relative;width:1280px;transform-origin:top left}.frame{width:1280px;height:720px;position:relative;display:none;background:#f6f8fa}.frame.active{display:block}.frame:before{content:'';position:absolute;left:0;top:48px;width:5px;height:56px;background:#008b9a}h1{position:absolute;left:72px;top:48px;margin:0;font-size:44px;line-height:1.16;font-weight:700;width:1136px}.art{position:absolute;left:72px;top:168px;width:1136px;height:404px;object-fit:contain}video.art{z-index:2}.takeaway{position:absolute;left:72px;top:588px;width:1136px;height:52px;border-top:1px solid #d4dde7;padding:10px 0 0 24px;font-size:27px;line-height:32px}.takeaway:before{content:'';position:absolute;left:0;top:14px;width:5px;height:24px;background:#008b9a}.source{position:absolute;left:72px;bottom:28px;width:1100px;min-height:20px;font-size:14px;line-height:18px;color:#586879}.number{position:absolute;right:32px;bottom:24px;font-size:14px;color:#586879}.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:16px 0 6px}button{font:500 15px Pretendard,sans-serif;border:1px solid #bac7d4;background:#fff;color:#142233;padding:9px 17px;border-radius:5px;cursor:pointer}button.primary{background:#1f5fae;color:white;border-color:#1f5fae}button:focus-visible{outline:3px solid #008b9a;outline-offset:3px}.status{text-align:center;color:#586879;font-size:13px;margin:6px 0}a{color:#1f5fae}@media print{@page{size:13.333333in 7.5in;margin:0}body{padding:0}.holder{height:auto!important;width:auto!important}.deck{transform:none!important}.frame{display:block!important;break-after:page}.frame:last-child{break-after:auto}.controls,.status,video{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="holder"><main class="deck" aria-label="도입부 슬라이드"></main></div><nav class="controls" aria-label="발표 재생"><button id="prev">이전</button><button id="play" class="primary">구간 재생</button><button id="next">다음</button><button id="all">처음부터 연속 재생</button></nav><p class="status">← → 구간 이동 · Space 재생/정지 · 각 구간 끝에서 멈춤</p><script type="module">
const meta=await(await fetch('slides.json')).json(); window.introSlides=meta;
const deck=document.querySelector('.deck'),holder=document.querySelector('.holder');
for(const s of meta){let frame=document.createElement('article');frame.className='frame';frame.innerHTML='<h1></h1><img class="art" alt=""><div class="takeaway"></div><footer class="source"></footer><span class="number"></span>';frame.querySelector('h1').textContent=s.title;frame.querySelector('img').src=s.id+'-end.png';frame.querySelector('img').alt=s.title+'의 최종 도해';frame.querySelector('.takeaway').textContent=s.takeaway;frame.querySelector('.source').textContent=s.source;frame.querySelector('.number').textContent=s.number;deck.append(frame)}
const frames=[...deck.children];let current=0,continuous=false;
const video=document.createElement('video');video.className='art';video.innerHTML='<source src="intro-sequence.webm" type="video/webm"><source src="intro-sequence.mp4" type="video/mp4">';video.preload='auto';video.muted=true;video.playsInline=true;video.setAttribute('aria-label','공간 좌표, 관측 신호, 시간차, 반사와 혼합, 배열, 연구 범위의 연속 애니메이션');
function resize(){let scale=Math.min(1.3,(innerWidth-32)/1280,(innerHeight-116)/720);scale=Math.max(.2,scale);deck.style.transform=`scale(${scale})`;holder.style.width=1280*scale+'px';holder.style.height=720*scale+'px'}
function activate(n){current=Math.max(0,Math.min(5,n));frames.forEach((f,i)=>f.classList.toggle('active',i===current));if(!video.parentElement)deck.append(video);document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===5;window.introCurrent=current}
async function playSegment(n){continuous=false;video.pause();activate(n);video.currentTime=meta[current].start;video.hidden=false;await video.play()}
function tick(){if(!video.paused){if(continuous){let n=meta.findIndex(s=>video.currentTime<s.end-.006);if(n>=0&&n!==current)activate(n)}else if(video.currentTime>=meta[current].end-1/60){video.pause()}}requestAnimationFrame(tick)}
document.querySelector('#prev').onclick=()=>playSegment(current-1);document.querySelector('#next').onclick=()=>playSegment(current+1);document.querySelector('#play').onclick=()=>video.paused?playSegment(current):video.pause();document.querySelector('#all').onclick=async()=>{continuous=true;activate(0);video.currentTime=0;video.hidden=false;await video.play()};
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowRight'&&current<5)playSegment(current+1);if(e.key==='ArrowLeft'&&current>0)playSegment(current-1);if(e.key===' ')document.querySelector('#play').click()});
video.addEventListener('play',()=>document.querySelector('#play').textContent='일시 정지');video.addEventListener('pause',()=>document.querySelector('#play').textContent='구간 다시 재생');addEventListener('resize',resize);activate(0);video.hidden=true;resize();tick();await document.fonts.ready;window.introReady=true;
</script></body></html>
